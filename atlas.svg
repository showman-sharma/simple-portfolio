<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">A map of Anirudh Sharma's pursuits</title>
  <desc id="desc">A restrained editorial atlas connecting Engineering, Research, Learning, Writing, Making, Stage and Anirudh at the centre.</desc>
  <defs>
    <style>
      :root{--bg:#f2eee5;--ink:#2c2925;--muted:#746f67;--line:#9c968c;--accent:#8f4d3f;--water:#9fb3b5;--e:#e3d6c6;--r:#dde1d5;--l:#deddd8;--w:#d8dfd0;--m:#e8ddcf;--s:#d9dbd5}
      .bg{fill:var(--bg)}.frame{fill:none;stroke:#c9c2b7;stroke-width:1.5}.outline{fill:#f7f3eb;stroke:#5f5a53;stroke-width:2.2}
      .contour{fill:none;stroke:#bdb6ab;stroke-width:1;opacity:.48}.river{fill:none;stroke:var(--water);stroke-width:5;opacity:.82;stroke-linecap:round}.road{fill:none;stroke:#9b8977;stroke-width:1.7;stroke-dasharray:7 8;opacity:.8}.border{fill:none;stroke:#8f8981;stroke-width:1.4;stroke-dasharray:5 7;opacity:.62}
      .district{transition:opacity .2s}.district:hover .wash{opacity:.86}.wash{opacity:.67;transition:opacity .2s}
      .label{font-family:Georgia,'Times New Roman',serif;font-size:31px;font-weight:600;fill:var(--ink);letter-spacing:-.01em}.meta{font-family:Arial,sans-serif;font-size:12px;fill:var(--muted);letter-spacing:.13em}.small{font-family:Arial,sans-serif;font-size:11px;fill:var(--muted);letter-spacing:.1em}.note{font-family:Georgia,'Times New Roman',serif;font-size:16px;font-style:italic;fill:#6b655d}.index{font-family:Arial,sans-serif;font-size:12px;fill:#5e5952}.node{fill:var(--accent)}.node-ring{fill:#f7f3eb;stroke:var(--accent);stroke-width:2}.node-label{font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:600;fill:var(--ink)}.node-meta{font-family:Arial,sans-serif;font-size:10px;fill:var(--accent);letter-spacing:.16em}.hotspot{fill:transparent;stroke:none;cursor:pointer}
    </style>
  </defs>

