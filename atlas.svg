    <style>
      .frame{fill:none;stroke:#6d5136;stroke-width:2}.frame2{fill:none;stroke:#6d5136;stroke-width:1;stroke-dasharray:7 6;opacity:.55}.coast{fill:url(#land);stroke:#6f5438;stroke-width:3;filter:url(#soft)}
      .shore{fill:none;stroke:#f0dfb6;stroke-width:10;opacity:.45}.river{fill:none;stroke:#587886;stroke-width:7;stroke-linecap:round;opacity:.75}.road{fill:none;stroke:#8f744f;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round;opacity:.8}
      .region{cursor:pointer}.region:hover .region-glow{opacity:.22}.region:hover .region-name{text-decoration:underline}.region-glow{opacity:0;transition:opacity .18s}.region-name{font-family:Georgia,'Times New Roman',serif;font-size:31px;letter-spacing:.06em;fill:#2f241c;font-weight:700}.region-sub{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:17px;fill:#5f4f42}.small{font-family:Georgia,'Times New Roman',serif;font-size:15px;fill:#5d4b3e}.micro{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.15em;fill:#6a5543}.title{font-family:Georgia,'Times New Roman',serif;font-size:52px;letter-spacing:.03em;fill:#2e2119}.subtitle{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-style:italic;fill:#5f4d3f}.quote{font-family:Georgia,'Times New Roman',serif;font-size:18px;font-style:italic;fill:#4d4035}.capital-title{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;fill:#2d221a}.capital-sub{font-family:Georgia,'Times New Roman',serif;font-size:15px;font-style:italic;fill:#5c493b}.legend{font-family:Georgia,'Times New Roman',serif;font-size:15px;fill:#4f4034}.hotspot{fill:transparent;stroke:transparent}.ornament{stroke:#72573d;fill:none;stroke-width:2;opacity:.7}
    </style>
  </defs>

