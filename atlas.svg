<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">A map of Anirudh Sharma's pursuits</title>
  <desc id="desc">A restrained cartographic map connecting Engineering, Research, Learning, Writing, Making, Stage and Anirudh at the centre.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1eee7"/><stop offset="1" stop-color="#e6e0d4"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e3dccd"/><stop offset="1" stop-color="#d8cfbd"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#877b69" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#514738" flood-opacity=".12"/></filter>
    <style>
      .frame{fill:none;stroke:#6d6559;stroke-width:1.2;opacity:.55}.coast{fill:url(#land);stroke:#625a4d;stroke-width:2.2;filter:url(#shadow)}
      .region-fill{opacity:.28;transition:opacity .18s,fill .18s}.region:hover .region-fill{opacity:.5}.region{cursor:pointer;outline:none}.region:focus-visible .region-fill{opacity:.55}
      .boundary{fill:none;stroke:#8a7d69;stroke-width:1.3;stroke-dasharray:5 6;opacity:.62}.road{fill:none;stroke:#8b5f45;stroke-width:2.2;stroke-linecap:round;opacity:.62}.minor-road{fill:none;stroke:#8b5f45;stroke-width:1.2;stroke-dasharray:3 5;opacity:.34}
      .river{fill:none;stroke:#6f8f98;stroke-width:4;stroke-linecap:round;opacity:.55}.contour{fill:none;stroke:#8f8576;stroke-width:1;opacity:.17}
      .label{font-family:Georgia,'Times New Roman',serif;font-size:31px;font-weight:600;fill:#2f2b26;letter-spacing:.015em;paint-order:stroke;stroke:#ece7dd;stroke-width:10;stroke-linejoin:round}.sub{font-family:Arial,sans-serif;font-size:13px;letter-spacing:.11em;fill:#665f55;text-transform:uppercase;paint-order:stroke;stroke:#ece7dd;stroke-width:7}.tiny{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.14em;fill:#766e63}.map-title{font-family:Georgia,'Times New Roman',serif;font-size:40px;font-weight:500;fill:#2f2b26}.map-kicker{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.18em;fill:#766e63}.note{font-family:Georgia,'Times New Roman',serif;font-size:16px;font-style:italic;fill:#6b6257}.node{fill:#f4f1ea;stroke:#7b4b3b;stroke-width:2}.node-dot{fill:#8b4c3d}.node-text{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.12em;fill:#7b4b3b;font-weight:700}.central-ring{fill:#f6f3ec;stroke:#8b4c3d;stroke-width:2.5}.central-dot{fill:#8b4c3d}.central-title{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:600;fill:#2d2924;paint-order:stroke;stroke:#f1eee7;stroke-width:12}.central-sub{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.15em;fill:#6b6258;paint-order:stroke;stroke:#f1eee7;stroke-width:8}.legend{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.08em;fill:#605a52}.legend-head{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.2em;fill:#7b4b3b;font-weight:700}.icon{fill:none;stroke:#5e584e;stroke-width:2;opacity:.7}.future{fill:none;stroke:#8a7d69;stroke-width:1.4;stroke-dasharray:5 7;opacity:.55}
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#paper)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>
  <rect class="frame" x="24" y="24" width="1552" height="872" rx="2"/>

  <text class="map-kicker" x="72" y="76">ANIRUDH SHARMA · PERSONAL MAP · HYDERABAD</text>
  <text class="map-title" x="72" y="120">A map of pursuits.</text>
  <text class="note" x="72" y="151">Not a hierarchy. Not a résumé. Just the places I keep returning to.</text>

