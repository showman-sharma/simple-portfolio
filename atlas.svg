<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The Atlas of Anirudh Sharma</title>
  <desc id="desc">A hand-drawn parchment atlas with clickable regions for Engineering, Research, Learning, Writing, Making, Stage and About.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ead6ad"/><stop offset=".45" stop-color="#e5cea1"/><stop offset="1" stop-color="#d7bb83"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d6c08c"/><stop offset="1" stop-color="#c7ab73"/></linearGradient>
    <pattern id="waves" width="34" height="18" patternUnits="userSpaceOnUse"><path d="M0 9 Q8 1 17 9 T34 9" fill="none" stroke="#617a7b" stroke-width="1" opacity=".22"/></pattern>
